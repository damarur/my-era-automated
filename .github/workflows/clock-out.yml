name: Clock out

on:
  workflow_dispatch:
  schedule:
    # Mon-Thu 17:00 Europe/Madrid = 15:00 UTC (CEST) or 16:00 UTC (CET)
    - cron: '0 15,16 * * 1-4'
    # Fri 14:00 Europe/Madrid = 12:00 UTC (CEST) or 13:00 UTC (CET)
    - cron: '0 12,13 * * 5'

jobs:
  clock-out:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against DST duplicate run / absences
        id: check
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          dow=$(TZ=Europe/Madrid date +%u) # 1=Mon .. 5=Fri
          today=$(TZ=Europe/Madrid date +%F)
          should_run=false
          if { [ "$dow" -le 4 ] && [ "$hour" = "17" ]; } || { [ "$dow" -eq 5 ] && [ "$hour" = "14" ]; }; then
            should_run=true
          fi
          while IFS= read -r line; do
            line="${line%%#*}"; line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            start="${line%%:*}"; end="${line##*:}"
            if [ "$today" \> "$start" -o "$today" = "$start" ] && [ "$today" \< "$end" -o "$today" = "$end" ]; then
              should_run=false
            fi
          done < absences.txt
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Login and get token
        id: login
        if: steps.check.outputs.should_run == 'true'
        uses: ./.github/actions/era-login
        with:
          user: ${{ secrets.ERA_USER }}
          pass: ${{ secrets.ERA_PASS }}

      - name: Clock out (TYPE=2)
        if: steps.check.outputs.should_run == 'true'
        run: |
          curl -sS -f -X POST "https://hcs.eratime.eu/api/proxy/flt/myera/feature/clocking?TYPE=2" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "hcs-application-key: ERAATTENDANCE" \
            -H "hcs-customer-key: lufthansa" \
            -H "hcs-user-code: ${{ secrets.ERA_USER }}" \
            -H "hcs-token: ${{ steps.login.outputs.token }}"
