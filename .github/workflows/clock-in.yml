name: Clock in

on:
  workflow_dispatch:
  schedule:
    # 08:00 Europe/Madrid is 06:00 UTC (CEST) or 07:00 UTC (CET).
    # Both are scheduled every day; the guard step below skips the wrong one.
    - cron: '0 6,7 * * *'

jobs:
  clock-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against DST duplicate run / absences
        id: check
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          today=$(TZ=Europe/Madrid date +%F)
          should_run=false
          if [ "$hour" = "08" ]; then
            should_run=true
          fi
          while IFS= read -r line; do
            line="${line%%#*}"; line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            start="${line%%:*}"; end="${line##*:}"
            if [ "$today" \> "$start" -o "$today" = "$start" ] && [ "$today" \< "$end" -o "$today" = "$end" ]; then
              should_run=false
            fi
          done < absences.txt
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Login and get token
        id: login
        if: steps.check.outputs.should_run == 'true'
        uses: ./.github/actions/era-login
        with:
          user: ${{ secrets.ERA_USER }}
          pass: ${{ secrets.ERA_PASS }}

      - name: Clock in (TYPE=1)
        if: steps.check.outputs.should_run == 'true'
        run: |
          curl -sS -f -X POST "https://hcs.eratime.eu/api/proxy/flt/myera/feature/clocking?TYPE=1" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "hcs-application-key: ERAATTENDANCE" \
            -H "hcs-customer-key: lufthansa" \
            -H "hcs-user-code: ${{ secrets.ERA_USER }}" \
            -H "hcs-token: ${{ steps.login.outputs.token }}"
