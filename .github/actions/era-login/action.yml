name: MyEra login
description: Logs in to MyEra and returns the auth token
inputs:
  user:
    required: true
  pass:
    required: true
outputs:
  token:
    value: ${{ steps.login.outputs.token }}
runs:
  using: composite
  steps:
    - id: login
      shell: bash
      run: |
        headers=$(curl -sS -D - -o /dev/null -X POST https://hcs.eratime.eu/api/proxy/login \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -H "hcs-application-key: ERAATTENDANCE" \
          -H "hcs-customer-key: lufthansa" \
          -H "hcs-user: ${{ inputs.user }}" \
          -H "hcs-pass: ${{ inputs.pass }}")
        token=$(echo "$headers" | grep -i '^hcs-token:' | sed -E 's/^[Hh]cs-[Tt]oken: *//' | tr -d '\r\n')
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
