<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MyEra Clock</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 320px; margin: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .brand img { width: 40px; height: 40px; }
    .brand b { display: block; font-size: 16px; }
    .brand span { color: #6b7280; font-size: 12.5px; }
    .field { display: block; margin-bottom: 12px; }
    .field > span { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: #4b5563; }
    .field input { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; color: #1f2937; background: #fafbff; border: 1px solid #cfd4ea; border-radius: 8px; transition: border-color .15s, box-shadow .15s; }
    .field input:focus { outline: none; border-color: #1a237e; box-shadow: 0 0 0 3px #e8eaf6; }
    .pw { position: relative; }
    .pw input { padding-right: 40px; }
    .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); flex: none; padding: 6px; background: none; border: 0; color: #6b7280; }
    .eye:hover { color: #1a237e; background: none; }
    .eye .off { display: none; }
    .eye.shown .on { display: none; }
    .eye.shown .off { display: block; }
    #loginError { margin: 0 0 12px; padding: 8px 10px; font-size: 13px; color: #b71c1c; background: #ffebee; border: 1px solid #ef9a9a; border-radius: 6px; }
    #loginError:empty { display: none; }
    [hidden] { display: none !important; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button, #settings {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 8px; font: inherit; font-weight: 600; cursor: pointer;
      border-radius: 6px; border: 1px solid transparent; box-sizing: border-box; text-decoration: none;
    }
    button:disabled { opacity: .5; cursor: default; }
    #in { background: #2e7d32; color: #fff; }
    #in:hover:not(:disabled) { background: #256b29; }
    #out { background: #c62828; color: #fff; }
    #out:hover:not(:disabled) { background: #ad2121; }
    #login { background: #1a237e; color: #fff; }
    #clear { background: #fff; color: #c62828; border-color: #ef9a9a; }
    #clear:hover:not(:disabled) { background: #ffebee; }
    .footer button, .footer a { padding: 10px 4px; gap: 4px; font-size: 13px; white-space: nowrap; min-width: 0; }
    .footer svg { width: 16px; height: 16px; }
    #open { color: #1b5e20; background: #e8f5e9; border-color: #a5d6a7; }
    #open:hover { background: #c8e6c9; }
    #settings { color: #1a237e; background: #e8eaf6; border-color: #9fa8da; }
    #settings:hover { background: #c5cae9; }
    #status { margin-top: 8px; font-size: 13px; }
    #status:empty { display: none; }
    .ok, .pos { color: #2e7d32; } .err, .neg { color: #c62828; } .pending { color: #888; }
    table { width: 100%; margin-top: 12px; border-collapse: collapse; }
    th { font-size: 11px; font-weight: 600; color: #666; text-align: right; padding-bottom: 2px; }
    th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
    td:first-child { width: 2.5em; }
    td { padding: 2px 0; text-align: right; font-variant-numeric: tabular-nums; }
    tr.today td:nth-child(-n+3) { font-weight: 600; }
    tfoot td:first-child { width: auto; }
    tfoot td { border-top: 1px solid #ccc; font-weight: 600; padding-top: 4px; }
    .nav { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
    .nav span { flex: 1; text-align: center; font-weight: 600; font-size: 12px; white-space: nowrap; }
    .nav button { flex: none; padding: 4px 6px; font-size: 12px; background: #fff; color: #1a237e; border-color: #9fa8da; }
    .nav button.active { background: #1a237e; color: #fff; }
    .nav svg { width: 14px; height: 14px; }
    .seg { display: flex; margin-left: 4px; }
    .seg button:first-child { border-radius: 6px 0 0 6px; }
    .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
    .scroll { max-height: 340px; overflow-y: auto; }
    .scroll table { margin-top: 4px; }
    thead th, tfoot td { position: sticky; background: #fff; }
    thead th { top: 0; }
    tfoot td { bottom: 0; }
    tr.monday:not(:first-child) td { border-top: 1px solid #eee; }
    .warn { margin-top: 12px; padding: 8px 10px; font-size: 12px; color: #6d4c00; background: #fff8e1; border: 1px solid #ffc107; border-left-width: 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <form id="loginView">
    <div class="brand">
      <img src="icon48.png" alt="">
      <div><b>MyEra Clock</b><span>Sign in with your MyEra account</span></div>
    </div>
    <label class="field"><span>User</span><input id="user" autocomplete="username" spellcheck="false"></label>
    <label class="field"><span>Password</span>
      <div class="pw">
        <input id="pass" type="password" autocomplete="current-password">
        <button type="button" class="eye" id="eye" title="Show password" aria-label="Show password">
          <svg class="on" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
    </label>
    <div id="loginError" role="alert"></div>
    <div class="row">
      <button type="submit" id="login">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Login
      </button>
    </div>
  </form>

  <div id="clockView" hidden>
    <div>Logged in as <b id="who"></b></div>
    <div class="row">
      <button id="in">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Clock in
      </button>
      <button id="out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Clock out
      </button>
    </div>
    <div class="nav">
      <button id="prev" class="icon" title="Previous"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span id="periodLabel"></span>
      <button id="next" class="icon" title="Next"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button id="today" title="Back to current period">Today</button>
      <div class="seg"><button id="weekBtn">Week</button><button id="monthBtn">Month</button></div>
    </div>
    <div class="scroll"><table id="week">
      <thead><tr><th>Day</th><th>Date</th><th>Worked</th><th>Target</th><th>Diff</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><td colspan="2" id="totalLabel">Week</td><td id="weekTotal">–</td><td id="weekTarget">–</td><td id="weekDiff">–</td></tr></tfoot>
    </table>
  </div>

  <div id="status"></div>

  <div class="row footer">
    <button id="open">
      <svg viewBox="0 0 763 763" aria-hidden="true"><circle cx="381.5" cy="381.5" r="381.5" fill="#F9A606" stroke="none"/><path d="M255 20L381.5 381.5 708 578A381.5 381.5 0 0 0 255 20Z" fill="#FBBD36" stroke="none"/><g stroke="#D48C00" stroke-width="36" stroke-linecap="round" opacity=".85"><path d="M251 83 359 389M381 405 556 503"/></g><g stroke-width="36" stroke-linecap="round"><path d="M273 75 381.5 381.5" stroke="#fff"/><path d="M381.5 381.5 568 495" stroke="#DADADA"/></g><circle cx="381.5" cy="381.5" r="30" fill="#fff" opacity=".6" stroke="none"/><circle cx="381.5" cy="381.5" r="18" fill="#fff" stroke="none"/></svg>
      myEra
    </button>
    <a href="#" id="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
    <button id="clear" hidden title="Clear credentials">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      Clear
    </button>
  </div>

  <div class="warn">⚠️ Credentials are saved unencrypted, locally in this browser only.</div>
  <script src="settings.js"></script>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
