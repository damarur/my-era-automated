<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MyEra Clock</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 260px; margin: 12px; }
    label { display: block; margin-bottom: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 8px; cursor: pointer; }
    #in { background: #2e7d32; color: #fff; border: 0; border-radius: 4px; }
    #out { background: #c62828; color: #fff; border: 0; border-radius: 4px; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; min-height: 1.2em; font-size: 13px; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
    small { color: #666; display: block; margin-top: 8px; }
  </style>
</head>
<body>
  <label>User code <input id="user" autocomplete="username"></label>
  <label>Password <input id="pass" type="password" autocomplete="current-password"></label>
  <div class="row">
    <button id="in">Clock in</button>
    <button id="out">Clock out</button>
  </div>
  <div id="status"></div>
  <small>Credentials saved locally in this browser only. <a href="#" id="settings">Reminder settings</a></small>
  <script src="popup.js"></script>
</body>
</html>
